<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Porsche Website</title>
</head>
<body>
    <header class="header">
        <!-- LEFT: Logo -->
        <div class="header-left">
            <a href="index.html">
                <img src="images/Logo.png" alt="Porsche Logo" class="logo">
            </a>
        </div>

        <!-- CENTER: Navigation -->
        <nav class="nav-center">
            <a href="index.html" class="active">Home</a>
            <a href="about.html">About Us</a>
            <a href="motorsports.html">Motorsports</a>
            <a href="contact.html">Contact Us</a>
            
            <!-- Dropdown -->
            <div class="dropdown">
                <button class="dropbtn" onclick="myFunction()">
                    More <i class="fa fa-caret-down"></i>
                </button>
                <div class="dropdown-content" id="myDropdown">
                    <a href="generations.html">Generations</a>
                    <a href="accessories.html">Accessories</a>
                    <a href="feedback.html">Feedback</a>
                </div>
            </div>
        </nav>

        <!-- RIGHT: Profile Icon -->
        <div class="header-right">
            <a href="login.html">
                <i class="fa-solid fa-circle-user"></i>
            </a>
        </div>
    </header>
    <main>
        <h2 class="form-title">Contact Us</h2>
        <p class="form-text">If you have any questions, feedback, or just want to talk cars, we'd love to hear from you!</p>

        <div class="form-container">
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>

            <div id="formMessage"></div>
        </div>
    </main>
   
    <footer>
        <p>Follow Porsche on:</p>
        <a href="https://www.facebook.com/porsche" target="_blank">Facebook</a>
        <a href="https://www.twitter.com/porsche" target="_blank">Twitter</a>
        <a href="https://www.instagram.com/porsche" target="_blank">Instagram</a>
        <a href="https://www.pinterest.com/porsche" target="_blank">Pinterest</a>
        <a href="https://www.youtube.com/porsche" target="_blank">Youtube</a>
        <br>
        <p>&copy; 2025 Porsche. All rights reserved. | <a href="#legal">Legal Services</a></p>
    </footer>

    <script>
        document.getElementById("contactForm").addEventListener("submit", function(event) {
          event.preventDefault();
      
          const name = document.getElementById("name").value.trim();
          const email = document.getElementById("email").value.trim();
          const message = document.getElementById("message").value.trim();
          const formMessage = document.getElementById("formMessage");
            
          //Remove previous style
          formMessage.classList.remove("success-message", "error-message");
      
          //Error message
          if (!name || !email || !message) {
            formMessage.classList.add("error-message");
            formMessage.textContent = "Please fill in all fields.";
            return;
          }

          //Success message
          formMessage.classList.add("success-message");
          formMessage.textContent = "Thank you for contacting us, " + name + "! We'll get back to you soon.";
          document.getElementById("contactForm").reset();
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/dropdown.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
